[package]
name = "lighthouse"
version = "0.1.0"
edition = "2021"
authors = ["ophiocus <csantanad@gmail.com>"]
description = "Fleet health telemetry for the Tecnocratica VPS"
license = "MIT"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
winres = "0.1"

[package.metadata.wix]
upgrade-guid = "AA3FEE2D-2906-4100-9DC0-362CDB69ADC0"
path-guid    = "6908FF9E-B0F3-4D7D-92FD-367D6F1BD9E7"
license      = false
eula         = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
